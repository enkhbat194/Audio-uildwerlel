name: Audio Factory - automatic audio QA
# No TTS calls, Google Cloud permissions, human review, or manual PASS clicks.
# Re-evaluate the fluent-v2 WAVs after correcting waveform duration calculations; no new TTS requests.
on:
  push:
    branches:
      - experiment/free-hosting-render-20261118
    paths:
      - scripts/auto_audio_qa.py
      - .github/workflows/audio-autoqa.yml

permissions:
  contents: read
  actions: read

jobs:
  validate-existing-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch previously generated real WAVs (NO new TTS)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/ahoj-qa-input
          gh run download 44397346692 -n ahoj-fluent-v2-44397346692 -D /tmp/ahoj-qa-input
          test -s /tmp/ahoj-qa-input/receipt.json
          test -s /tmp/ahoj-qa-input/QA_ONLY_FULL_SENTENCE_natural.wav
          test -s /tmp/ahoj-qa-input/QA_ONLY_FULL_SENTENCE_learning_slow.wav
      - name: Offline ASR installation (no paid Speech-to-Text service)
        run: python -m pip install --disable-pip-version-check 'faster-whisper==1.2.1' 'av==18.1.0'
      - name: Fully automatic Czech speech QA
        run: |
          python scripts/auto_audio_qa.py \
            --input-dir /tmp/ahoj-qa-input \
            --output /tmp/ahoj-qa-output/auto_qa_report.json \
            --model small
          python - <<'PY'
          import json
          p='/tmp/ahoj-qa-output/auto_qa_report.json'
          data=json.load(open(p))
          for name, item in data['variants'].items():
              print(name, item['decision'], 'transcript:', item['asr_transcript'])
          PY
      - name: Save automated decisions (no curriculum release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahoj-automated-qa-${{ github.run_id }}
          path: /tmp/ahoj-qa-output/
          retention-days: 30
          if-no-files-found: warn
