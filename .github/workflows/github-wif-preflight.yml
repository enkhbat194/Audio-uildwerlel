name: Audio Factory - WIF keyless preflight

# This workflow is ONLY a federation connectivity probe.
# It never requests TTS, reads/writes a GCS object, or deploys Render/Cloud Run.
on:
  push:
    branches:
      - experiment/free-hosting-render-20261118
    paths:
      - .github/workflows/github-wif-preflight.yml
      - scripts/bootstrap-github-wif.sh
      - docs/GITHUB_WIF_HANDOFF.md
      - qa/requests/VOICE_QA_RUN_20261119.json
      - qa/requests/VOICE_QA_NATURAL_REPAIR_20261119.json
      - qa/requests/VOICE_QA_FLUENT_V2_20261119.json
      - production/requests/2026-11-19-pilot4.json
  workflow_dispatch:
    inputs:
      generate_two_wavs:
        description: 'Run exactly two billed Czech sentence TTS requests?'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  readiness:
    name: Check WIF configuration (no cloud access)
    runs-on: ubuntu-latest
    steps:
      - name: Check branch and fixed non-secret WIF resource identifiers
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          PROVIDER: projects/814331085807/locations/global/workloadIdentityPools/ahoj-audio-gh/providers/preflight
          SERVICE_ACCOUNT: ahoj-gh-preflight@project-a699c3ff-995a-4b88-add.iam.gserviceaccount.com
        run: |
          set -euo pipefail
          test "$REPO" = "enkhbat194/Audio-uildwerlel"
          test "$REF" = "refs/heads/experiment/free-hosting-render-20261118"
          test "$PROVIDER" = "projects/814331085807/locations/global/workloadIdentityPools/ahoj-audio-gh/providers/preflight"
          test "$SERVICE_ACCOUNT" = "ahoj-gh-preflight@project-a699c3ff-995a-4b88-add.iam.gserviceaccount.com"
          echo "WIF_CONFIGURED: using fixed non-secret resource names; no repository variables needed."

  token-only:
    name: Mint short-lived token (no TTS or GCS calls)
    needs: readiness
    if: ${{ github.repository == 'enkhbat194/Audio-uildwerlel' && github.ref == 'refs/heads/experiment/free-hosting-render-20261118' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 5
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@v4
      - name: Authenticate via GitHub OIDC without a service account key
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: project-a699c3ff-995a-4b88-add
          workload_identity_provider: projects/814331085807/locations/global/workloadIdentityPools/ahoj-audio-gh/providers/preflight
          service_account: ahoj-gh-preflight@project-a699c3ff-995a-4b88-add.iam.gserviceaccount.com
          create_credentials_file: false
          export_environment_variables: false
          token_format: access_token
          access_token_lifetime: 600s
      - name: Check token issuance without logging its contents
        env:
          FEDERATED_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$FEDERATED_TOKEN"
          echo "WIF_TOKEN_OK: short-lived token minted. No Vertex AI or Cloud Storage requests were made."

  voice-quality-two-wavs:
    name: Generate two Czech QA WAVs — ONLY explicit run, no GCS
    needs: readiness
    if: >-
      github.repository == 'enkhbat194/Audio-uildwerlel' &&
      github.ref == 'refs/heads/experiment/free-hosting-render-20261118' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.generate_two_wavs == true) ||
        (github.event_name == 'push' && github.event.head_commit.message == 'qa(run): generate two full-sentence WAV once')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact reviewed branch
        uses: actions/checkout@v4
      - name: Authenticate as existing branch-restricted GitHub WIF account
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/814331085807/locations/global/workloadIdentityPools/ahoj-audio-gh/providers/preflight
          service_account: ahoj-gh-preflight@project-a699c3ff-995a-4b88-add.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Generate EXACTLY two sentence WAVs without retries (billable)
        env:
          AHOJ_GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          AHOJ_VOICE_QA_OUTPUT_DIR: ${{ runner.temp }}/ahoj-voice-qa
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/voice_quality_full_sentence.py
          python3 scripts/voice_quality_full_sentence.py --generate --artifact-only
      - name: Install offline ASR for zero-touch QA
        run: python3 -m pip install --disable-pip-version-check 'faster-whisper==1.2.1' 'av==18.1.0'
      - name: Automatically check Czech text and audio quality
        if: success()
        env:
          AHOJ_VOICE_QA_OUTPUT_DIR: ${{ runner.temp }}/ahoj-voice-qa
        run: |
          python3 scripts/auto_audio_qa.py \
            --input-dir "$AHOJ_VOICE_QA_OUTPUT_DIR" \
            --output "$AHOJ_VOICE_QA_OUTPUT_DIR/auto_qa_report.json" \
            --model small
      - name: Upload audio and QA receipt, even if one generation failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahoj-full-sentence-voice-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/ahoj-voice-qa/
          retention-days: 7
          if-no-files-found: warn

  voice-quality-natural-repair:
    name: One bounded Natural correction + automatic QA (no manual approval)
    needs: readiness
    if: >-
      github.event_name == 'push' &&
      github.repository == 'enkhbat194/Audio-uildwerlel' &&
      github.ref == 'refs/heads/experiment/free-hosting-render-20261118' &&
      github.event.head_commit.message == 'qa(run): one bounded natural re-render and auto-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
      - name: Authenticate with the already-approved GitHub WIF identity
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/814331085807/locations/global/workloadIdentityPools/ahoj-audio-gh/providers/preflight
          service_account: ahoj-gh-preflight@project-a699c3ff-995a-4b88-add.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Re-render ONLY Natural once without changing the Czech text
        env:
          AHOJ_GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          AHOJ_VOICE_QA_OUTPUT_DIR: ${{ runner.temp }}/ahoj-natural-repair
          GITHUB_ACTIONS: 'true'
        run: |
          python3 scripts/voice_quality_full_sentence.py \
            --generate --artifact-only --only-style natural --natural-repair
      - name: Install offline ASR
        run: python3 -m pip install --disable-pip-version-check 'faster-whisper==1.2.1' 'av==18.1.0'
      - name: Automatic transcript QA; quarantine any mismatch
        env:
          AHOJ_VOICE_QA_OUTPUT_DIR: ${{ runner.temp }}/ahoj-natural-repair
        run: |
          python3 scripts/auto_audio_qa.py \
            --input-dir "$AHOJ_VOICE_QA_OUTPUT_DIR" \
            --output "$AHOJ_VOICE_QA_OUTPUT_DIR/auto_qa_report.json" \
            --model small
      - name: Save corrected WAV and automatic QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahoj-natural-auto-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/ahoj-natural-repair/
          retention-days: 14
          if-no-files-found: warn

  voice-quality-fluent-v2:
    name: Fluent Czech Natural and Slow — two attempts + automatic pause QA
    needs: readiness
    if: >-
      github.event_name == 'push' &&
      github.repository == 'enkhbat194/Audio-uildwerlel' &&
      github.ref == 'refs/heads/experiment/free-hosting-render-20261118' &&
      github.event.head_commit.message == 'qa(run): fluent-v2 two WAVs once'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out locked experimental branch
        uses: actions/checkout@v4
      - name: Authenticate by existing limited GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/814331085807/locations/global/workloadIdentityPools/ahoj-audio-gh/providers/preflight
          service_account: ahoj-gh-preflight@project-a699c3ff-995a-4b88-add.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Generate two bounded, potentially billed Czech WAVs
        env:
          AHOJ_GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          AHOJ_VOICE_QA_OUTPUT_DIR: ${{ runner.temp }}/ahoj-fluent-v2
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/voice_quality_full_sentence.py scripts/auto_audio_qa.py
          python3 scripts/voice_quality_full_sentence.py --generate --artifact-only --fluent-v2
      - name: Offline ASR dependencies
        run: python3 -m pip install --disable-pip-version-check 'faster-whisper==1.2.1' 'av==18.1.0'
      - name: Auto QA exact Czech + waveform pauses, fail-closed
        env:
          AHOJ_VOICE_QA_OUTPUT_DIR: ${{ runner.temp }}/ahoj-fluent-v2
        run: |
          python3 scripts/auto_audio_qa.py \
            --input-dir "$AHOJ_VOICE_QA_OUTPUT_DIR" \
            --output "$AHOJ_VOICE_QA_OUTPUT_DIR/auto_qa_report.json" --model small
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ["AHOJ_VOICE_QA_OUTPUT_DIR"],"auto_qa_report.json")
          data = json.load(open(p))
          for name, report in data["variants"].items():
              print(name, report["decision"], "longest_pause_s",
                    report["technical"].get("max_internal_pause_seconds"),
                    "ASR", report["asr_transcript"])
          PY
      - name: Keep both WAVs and QA verdicts private, regardless of QA outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahoj-fluent-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/ahoj-fluent-v2/
          retention-days: 14
          if-no-files-found: warn

  curriculum-teacher-pilot-four:
    name: Produce first lesson four phrases x two styles, automatic QA
    needs: readiness
    if: >-
      github.event_name == 'push' &&
      github.repository == 'enkhbat194/Audio-uildwerlel' &&
      github.ref == 'refs/heads/experiment/free-hosting-render-20261118' &&
      github.event.head_commit.message == 'audio(run): first lesson pilot4 one-shot'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source-locked experiment branch
        uses: actions/checkout@v4
      - name: Authenticate using existing branch-restricted WIF account
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/814331085807/locations/global/workloadIdentityPools/ahoj-audio-gh/providers/preflight
          service_account: ahoj-gh-preflight@project-a699c3ff-995a-4b88-add.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Offline Czech ASR dependencies
        run: python3 -m pip install --disable-pip-version-check 'faster-whisper==1.2.1' 'av==18.1.0'
      - name: Run bounded real TTS + QA, never publish rejected or draft lessons
        env:
          AHOJ_GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/produce_curriculum_batch.py scripts/auto_audio_qa.py scripts/voice_quality_full_sentence.py
          python3 scripts/produce_curriculum_batch.py \
            --manifest production/manifest/2026-11-19-first-4-verified.json \
            --out-dir "${{ runner.temp }}/ahoj-curriculum-pilot4" \
            --generate
          python3 - <<'PY'
          import json
          p = r"${{ runner.temp }}/ahoj-curriculum-pilot4/production_report.json"
          data = json.load(open(p))
          assert data["attempted_calls"] <= 8
          assert data["release_allowed"] is False
          assert len(data["rows"]) == 8
          print("PRODUCTION_PILOT4_RESULT", json.dumps(data["counts"], sort_keys=True))
          PY
      - name: Save passed WAVs, quarantines, immutable QA and source manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahoj-lesson-pilot4-${{ github.run_id }}
          path: ${{ runner.temp }}/ahoj-curriculum-pilot4/
          retention-days: 30
          if-no-files-found: warn
