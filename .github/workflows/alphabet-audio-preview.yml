name: Ahoj alphabet — bounded Gemini 3.8 TTS, QA and Preview assets
on:
  push:
    branches:
      - experiment/free-hosting-render-20261118
    paths:
      - .github/workflows/alphabet-audio-preview.yml
      - production/alphabet/pack*.json
      - scripts/generate_alphabet_pack.py
permissions:
  contents: write
  id-token: write
jobs:
  generate-pack01:
    if: >-
      github.repository == 'enkhbat194/Audio-uildwerlel' &&
      github.ref == 'refs/heads/experiment/free-hosting-render-20261118' &&
      github.event.head_commit.message == 'audio(run): alphabet pack01 10 Gemini calls'
    runs-on: ubuntu-latest
    timeout-minutes: 38
    concurrency:
      group: alphabet-gemini-tts-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact pack, SHA contracts and upper limit (no TTS)
        run: |
          python3 -m py_compile scripts/generate_alphabet_pack.py
          python3 scripts/generate_alphabet_pack.py --pack pack01
      - name: Authenticate existing branch-restricted WIF identity
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/814331085807/locations/global/workloadIdentityPools/ahoj-audio-gh/providers/preflight
          service_account: ahoj-gh-preflight@project-a699c3ff-995a-4b88-add.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Install independent offline Czech ASR
        run: python3 -m pip install --disable-pip-version-check 'faster-whisper==1.2.1' 'av==18.1.0'
      - name: Generate at most ten real Gemini 3.8 clips and QA, no retries
        env:
          AHOJ_GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          AHOJ_ALPHABET_OUT: ${{ runner.temp }}/ahoj-alphabet
          GITHUB_ACTIONS: 'true'
        run: |
          python3 scripts/generate_alphabet_pack.py --pack pack01 --generate
      - name: Publish only QA-permitted audio to source repo Preview assets
        run: |
          set -euo pipefail
          test -s production/alphabet-preview/pack01/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('production/alphabet-preview/pack01/manifest.json').read_text())
          assert d['publicationAllowed'] is False
          assert d['attemptedCalls']<=10
          good=[x for x in d['rows'] if x['previewAllowed']]
          for x in good:
              assert x['decision'] in ('TECHNICAL_PREVIEW','AUTO_PASS')
              assert x['nativeApproved'] is False
              assert Path(x['repoPath']).is_file()
          print('PREVIEW_ASSETS_QA_ALLOWED',len(good))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/alphabet-preview/pack01
          git commit -m 'audio(assets): Gemini 3.8 alphabet pack01 QA Preview [skip ci]'
          git push origin HEAD:experiment/free-hosting-render-20261118
      - name: Preserve immutable generated receipts and quarantined WAVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahoj-alphabet-pack01-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ahoj-alphabet/pack01/
            production/alphabet-preview/pack01/
          retention-days: 30
          if-no-files-found: warn
