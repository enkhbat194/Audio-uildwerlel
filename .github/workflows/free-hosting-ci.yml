name: Audio Factory - free hosting CI

on:
  push:
    branches:
      - experiment/free-hosting-render-20261118
  pull_request:
    branches:
      - experiment/free-hosting-render-20261118
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-factory-free-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: TypeScript, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript diagnostics
        run: bun run lint
      - name: Automated tests
        run: bun run test
      - name: Build Vite distribution
        run: bun run build
      - name: Verify WIF bootstrap is dry-run by default
        run: |
          bash -n scripts/bootstrap-github-wif.sh
          bash scripts/bootstrap-github-wif.sh > /tmp/wif-dry-run.txt
          grep -q 'DRY RUN' /tmp/wif-dry-run.txt
          grep -q 'No service account JSON keys' /tmp/wif-dry-run.txt
          grep -q 'ahoj-gh-preflight' /tmp/wif-dry-run.txt
      - name: Dry-run full-sentence voice quality protocol (zero API calls)
        run: |
          python3 -m py_compile scripts/voice_quality_full_sentence.py
          python3 -m py_compile scripts/auto_audio_qa.py
          python3 scripts/voice_quality_full_sentence.py > /tmp/ahoj-full-sentence-dry-run.txt
          grep -q 'DRY_RUN_OK' /tmp/ahoj-full-sentence-dry-run.txt
          grep -q 'Můžete mi prosím říct' /tmp/ahoj-full-sentence-dry-run.txt
          grep -q 'QA only' /tmp/ahoj-full-sentence-dry-run.txt
      - name: Confirm build artifact
        run: test -f dist/index.html
      - name: Build isolated Render preview and inspect output
        run: |
          VITE_FREE_HOSTING_POC=true bun run build
          test -f dist/index.html
          grep -Rl 'Туршилтын сервер ажиллаж байна' dist/assets/*.js > /tmp/poc-bundle-match.txt
          test -s /tmp/poc-bundle-match.txt
      - name: Restore production client build for API smoke tests
        run: bun run build
      - name: Smoke test production server and owner protection
        env:
          NODE_ENV: production
          PORT: "8765"
        run: |
          bun run server.ts > /tmp/ahoj-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:8765/api/health > /tmp/ahoj-health.json; then
              break
            fi
            sleep 1
          done
          if [ ! -s /tmp/ahoj-health.json ]; then
            cat /tmp/ahoj-api.log
            exit 1
          fi
          node -e 'const h=require("/tmp/ahoj-health.json"); if(h.ok!==true||h.auth_required!==true)process.exit(1)'
          unauth_code=$(curl --silent --output /tmp/ahoj-unauth.json --write-out '%{http_code}' http://127.0.0.1:8765/api/state)
          test "$unauth_code" = "401"
          node -e 'const d=require("/tmp/ahoj-unauth.json"); if(d.code!=="OWNER_AUTH_REQUIRED")process.exit(1)'
      - name: Smoke test free-hosting read-only safeguard
        env:
          NODE_ENV: production
          FREE_HOSTING_POC: "true"
          PORT: "8766"
        run: |
          bun run server.ts > /tmp/ahoj-poc.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:8766/api/health > /tmp/ahoj-poc-health.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/ahoj-poc-health.json || { cat /tmp/ahoj-poc.log; exit 1; }
          echo "Check that a billable TTS request fails BEFORE calling Vertex AI"
          blocked_code=$(curl --silent --output /tmp/ahoj-poc-blocked.json --write-out '%{http_code}' -H 'content-type: application/json' -d '{"sourceId":"CZ-A0-M01-L01-PH001","mode":"vertex"}' http://127.0.0.1:8766/api/tts/generate)
          test "$blocked_code" = "403"
          node -e 'const d=require("/tmp/ahoj-poc-blocked.json"); if(d.code!=="FREE_HOSTING_READ_ONLY")process.exit(1)'
          echo "Check that the registry is still owner-protected"
          private_code=$(curl --silent --output /tmp/ahoj-poc-private.json --write-out '%{http_code}' http://127.0.0.1:8766/api/state)
          test "$private_code" = "401"
